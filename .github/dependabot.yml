version: 2

multi-ecosystem-groups:
  app-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: npm
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: app-dependencies
    labels:
      - dependencies

  - package-ecosystem: uv
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: app-dependencies
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    labels:
      - dependencies