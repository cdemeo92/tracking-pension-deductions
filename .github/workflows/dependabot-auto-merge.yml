name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: read

jobs:
  enable-auto-merge:
    name: Enable Dependabot auto-merge
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-major) COMMIT_TYPE="feat(deps)!" ;;
            version-update:semver-minor) COMMIT_TYPE="feat(deps)" ;;
            *) COMMIT_TYPE="fix(deps)" ;;
          esac
          gh pr merge --auto --squash --subject "$COMMIT_TYPE: update $DEPENDENCY_NAMES" "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}

  release-after-merge:
    name: Release after Dependabot merge
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch CI and release workflow
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}