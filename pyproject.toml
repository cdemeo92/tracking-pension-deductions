[project]
name = "tracking-pension-deductions"
version = "0.1.0"
description = "Track Italian supplementary pension contributions and annual deduction limits"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E731"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
